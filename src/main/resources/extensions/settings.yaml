apiVersion: v1alpha1
kind: Setting
metadata:
  name: obsidian-core-settings
spec:
  forms:
    - group: obsidian
      label: 双链与图谱
      formSchema:
        - $formkit: checkbox
          name: allowAnonymousGraph
          label: 开放主题端图谱
          value: false
          help: 允许访客查看公开文章的关系图谱；范围和外观在插入图谱时设置。
        - $formkit: number
          name: graphMaxNodes
          label: 节点上限
          value: 500
          min: 50
          max: 5000
          help: 限制单个图谱的节点数量，避免大图谱影响页面性能。
        - $el: details
          children:
            - $el: summary
              children: 高级设置
            - $formkit: categorySelect
              name: excludeCategories
              label: 排除分类
              multiple: true
              help: 隐藏这些分类节点及其归属边，不影响文章和双链索引。
            - $formkit: tagSelect
              name: excludeTags
              label: 排除标签
              multiple: true
              help: 隐藏这些标签节点及其归属边，不影响文章和双链索引。
            - $formkit: checkbox
              name: renderWikilinks
              label: 渲染标题式双链
              value: true
              help: 兼容 [[标题]] 写法；不影响 obsidian-core-link 标签。
            - $formkit: checkbox
              name: caseSensitive
              label: 标题匹配区分大小写
              value: false
            - $formkit: checkbox
              name: renderBrokenLinks
              label: 弱化未解析的标题式双链
              value: false
              help: 为未解析的 [[标题]] 显示弱化样式，默认保留原文。
