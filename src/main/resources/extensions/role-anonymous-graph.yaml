apiVersion: v1alpha1
kind: Role
metadata:
  name: anonymous-obsidian-core-graph
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
    halo.run/hidden: "true"
rules:
  - apiGroups:
      - api.obsidian-core.halo.run
    resources:
      - graph
    verbs:
      - get
      - list
