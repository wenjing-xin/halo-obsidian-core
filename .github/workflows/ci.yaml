name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-ci.yaml@v5
    with:
      ui-path: "ui"
      # pnpm setup runs at the repository root; packageManager is in ui/package.json.
      pnpm-version: "10.33.0"
      node-version: "24"
      java-version: "21"
