name: CD

on:
  release:
    types:
      - published

jobs:
  cd:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-cd.yaml@v5
    secrets:
      # https://github.com/halo-sigs/reusable-workflows#githubworkflowsplugin-cdyaml
      halo-pat: ${{ secrets.HALO_PAT }}
    permissions:
      contents: write
    with:
      ui-path: "ui"
      # pnpm setup runs at the repository root; packageManager is in ui/package.json.
      pnpm-version: "10.33.0"
      node-version: "24"
      java-version: "21"
      app-id: app-zpu0pwze
      skip-appstore-release: false
      sync-github-readme: true
